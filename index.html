function figlet(word){
  const glyphs = String(word).split('').map(ch => FONT[ch.toUpperCase()] || FONT[ch] || FONT[' ']);
  const rows = [];
  for (let i = 0; i < 5; i++) rows.push(glyphs.map(g => g[i]).join(' '));
  return rows;
}

const $ = id => document.getElementById(id);
const out = $('output'), scr = $('screen'), inp = $('inp'), crt = $('crt');
const T0 = Date.now();
const hist = []; let hi = 0;

/* ── sound ── */
let audioCtx = null;
let soundOn = true;
try { soundOn = localStorage.getItem('vsh-sound') !== 'off'; } catch(e) {}
function beep(freq, dur, type, vol) {
  if (!soundOn) return;
  freq = freq || 440; dur = dur || 0.05; type = type || 'square'; vol = vol || 0.04;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

/* ── helpers ── */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function line(html, cls){
  const d = document.createElement('div');
  d.className = 't' + (cls ? ' ' + cls : '');
  d.innerHTML = html || '&nbsp;';
  out.appendChild(d);
  scr.scrollTop = scr.scrollHeight;
}
function blank(){ line(''); }
function link(url, label){ return '<a href="' + url + '" target="_blank" rel="noopener">' + (label || url) + '</a>'; }
function runChip(cmd, label){ return '<span class="chiprun" data-cmd="' + cmd + '">' + esc(label || cmd) + '</span>'; }

function echoInput(raw){ line(promptHTML() + esc(raw)); }
function pad(s, n){ s = String(s); return s.length >= n ? s : s + ' '.repeat(n - s.length); }
function bar(pct, width){
  width = width || 16;
  const f = Math.round(pct / 100 * width);
  return '█'.repeat(f) + '░'.repeat(width - f);
}
function uptime(){
  const s = Math.floor((Date.now() - T0) / 1000);
  return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}
function copyText(t){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(() => true).catch(() => fallback());
  }
  return Promise.resolve(fallback());
}
function glitchAndShake(){

/* ── page overlay ── */
function openOverlay(url) {
  if (document.getElementById('overlay-frame')) return;
  if (gameManager.game) { line('<span class="amber">a game is running — esc first</span>'); return; }

  const wrap = document.createElement('div');
  wrap.id = 'overlay-frame';
  wrap.style.cssText = 'position:absolute;inset:0;z-index:11;background:var(--bg);display:flex;flex-direction:column;';

  const bar = document.createElement('div');
  bar.style.cssText = 'height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.025);border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:var(--dim);user-select:none;';

  const iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.style.cssText = 'flex:1;border:0;background:var(--bg);width:100%;';

  wrap.appendChild(bar);
  wrap.appendChild(iframe);
  crt.appendChild(wrap);

  function close(){
    wrap.remove();
    window.removeEventListener('keydown', onEsc);
    window.removeEventListener('message', onMsg);
    inp.focus({ preventScroll: true });
  }
  function onEsc(e){ if (e.key === 'Escape') { e.preventDefault(); close(); } }
  function onMsg(e){ if (e.data && e.data.type === 'close-overlay') close(); }
  document.getElementById('overlay-close').addEventListener('click', close);
  window.addEventListener('keydown', onEsc);
  window.addEventListener('message', onMsg);

  iframe.addEventListener('load', () => {
    try { iframe.focus(); } catch(e) {}
    try {
      iframe.contentWindow.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); close(); }
      });
    } catch(err) {}
  });

  beep(660, 0.05);
}

/* ── games ── */
function createSnake(){
  const W = 30, H = 16;
  const box = document.createElement('div');
  box.className = 'game-box';
  box.innerHTML = '<div class="game-hud">snake · score: <span class="sc" id="snake-sc">0</span> · arrows/wasd · q to quit</div>';
  const pre = document.createElement('pre');
  pre.style.color = 'var(--cyan)'; // Make snake pop
  box.appendChild(pre);

  scr.scrollTop = scr.scrollHeight;

  let snake = [{x:15, y:8}];
  let dir = {x:1, y:0}, nextDir = dir;
  let food = spawnFood();
  let score = 0, speed = 130, alive = true, timer = null;

  function spawnFood(){
    while (true) {
      const f = {x: Math.floor(Math.random()*W), y: Math.floor(Math.random()*H)};
      if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
    }
  }
  function render(){
    const rows = [];
    for (let y = 0; y < H; y++) {
      let row = '';
      for (let x = 0; x < W; x++) {
        if (snake[0].x === x && snake[0].y === y) row += '██';
        else if (snake.some(s => s.x === x && s.y === y)) row += '▓▓';
        else if (food.x === x && food.y === y) row += '●●';
        else row += '  ';
      }
      rows.push(row);
    }
    pre.textContent = rows.join('\n');
    const sc = document.getElementById('snake-sc');
    if (sc) sc.textContent = score;
  }
  function tick(){
    if (!alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= W || head.y < 0 || head.y >= H || snake.some(s => s.x === head.x && s.y === head.y)) {
      alive = false;
      beep(80, 0.3, 'sawtooth');
      const hud = box.querySelector('.game-hud');
      hud.innerHTML = '<span class="red bold">GAME OVER</span> · score: <span class="sc">' + score + '</span> · press any key or esc';
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10; beep(880, 0.06); food = spawnFood();
      if (speed > 65) speed -= 2;
    } else snake.pop();
    render();
    timer = setTimeout(tick, speed);
  }
  function die(){ alive = false; if (timer) clearTimeout(timer); }
  render();
  timer = setTimeout(tick, 400);
  return {
    onKey(e){
      e.preventDefault();
      if (!alive) { gameManager.stop(); return; }
      const k = e.key.toLowerCase();
      if (k === 'q') { gameManager.stop(); return; }
      if ((k === 'arrowup' || k === 'w') && dir.y !== 1) nextDir = {x:0, y:-1};
      else if ((k === 'arrowdown' || k === 's') && dir.y !== -1) nextDir = {x:0, y:1};
      else if ((k === 'arrowleft' || k === 'a') && dir.x !== 1) nextDir = {x:-1, y:0};
      else if ((k === 'arrowright' || k === 'd') && dir.x !== -1) nextDir = {x:1, y:0};
    },
    stop(){ die(); box.remove(); }
  };
}

function create2048(){
  const box = document.createElement('div');
  box.className = 'game-box';
  const hud = document.createElement('div');
  hud.className = 'game-hud';
  const board = document.createElement('div');
  board.className = 'g2048';
  box.appendChild(hud);
  box.appendChild(board);
  out.appendChild(box);
  scr.scrollTop = scr.scrollHeight;

  let grid = Array(4).fill(0).map(() => Array(4).fill(0));
  let score = 0, alive = true;

  function spawn(){
    const empty = [];
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if (grid[y][x] === 0) empty.push({x, y});
    if (!empty.length) return;
    const c = empty[Math.floor(Math.random() * empty.length)];
    grid[c.y][c.x] = Math.random() < 0.9 ? 2 : 4;
  }
  function colors(v){
    if (v === 0) return 'rgba(255,255,255,.04)';
    if (v === 2) return 'rgba(63,228,255,.18)';
    if (v === 4) return 'rgba(63,228,255,.32)';
    if (v === 8) return 'rgba(167,139,250,.35)';
    if (v === 16) return 'rgba(167,139,250,.5)';
    if (v === 32) return 'rgba(255,203,92,.4)';
    if (v === 64) return 'rgba(255,203,92,.6)';
    if (v === 128) return 'rgba(255,107,138,.5)';
    if (v === 256) return 'rgba(255,107,138,.7)';
    return 'rgba(99,242,164,.65)';
  }
  function render(){
    let html = '';
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      const v = grid[y][x];
      const size = v >= 1024 ? '13px' : v >= 128 ? '15px' : '18px';
      html += '<div class="cell" style="background:' + colors(v) + ';font-size:' + size + '">' + (v || '') + '</div>';
    }
    board.innerHTML = html;
    hud.innerHTML = 'score: <span class="sc">' + score + '</span> · arrows/wasd · q to quit';
  }
  function slideLeft(g){
    for (let y = 0; y < 4; y++) {
      const row = g[y].filter(v => v);
      for (let i = 0; i < row.length - 1; i++) {
        if (row[i] === row[i+1]) { row[i] *= 2; score += row[i]; row.splice(i+1, 1); }
      }
      while (row.length < 4) row.push(0);
      g[y] = row;
    }
  }
  function transpose(g){
    const ng = [];
    for (let x = 0; x < 4; x++) { ng.push([]); for (let y = 0; y < 4; y++) ng[x].push(g[y][x]); }
    return ng;
  }
  function revRows(g){ return g.map(r => r.slice().reverse()); }
  function clone(g){ return g.map(r => r.slice()); }
  function isDead(g){
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      if (g[y][x] === 0) return false;
      if (x < 3 && g[y][x] === g[y][x+1]) return false;
      if (y < 3 && g[y][x] === g[y+1][x]) return false;
    }
    return true;
  }
  function move(dir){
    if (!alive) return;
    const before = JSON.stringify(grid);
    let g = clone(grid);
    if (dir === 'left') slideLeft(g);
    else if (dir === 'right') { g = revRows(g); slideLeft(g); g = revRows(g); }
    else if (dir === 'up') { g = transpose(g); slideLeft(g); g = transpose(g); }
    else if (dir === 'down') { g = transpose(g); g = revRows(g); slideLeft(g); g = revRows(g); g = transpose(g); }
    if (JSON.stringify(g) !== before) {
      grid = g; spawn(); render(); beep(520, 0.03);
      if (isDead(grid)) {
        alive = false;
        beep(120, 0.4, 'sawtooth');
        hud.innerHTML = '<span class="red bold">GAME OVER</span> · score: <span class="sc">' + score + '</span> · press any key or esc';
      }
    }
  }
  spawn(); spawn(); render();
  return {
    onKey(e){
      e.preventDefault();
      if (!alive) { gameManager.stop(); return; }
      const k = e.key.toLowerCase();
      if (k === 'q') { gameManager.stop(); return; }
      if (k === 'arrowleft' || k === 'a') move('left');
      else if (k === 'arrowright' || k === 'd') move('right');
      else if (k === 'arrowup' || k === 'w') move('up');
      else if (k === 'arrowdown' || k === 's') move('down');
    },
    stop(){ box.remove(); }
  };
}

function createTTT(){
  const box = document.createElement('div');
  box.className = 'game-box';
  const hud = document.createElement('div');
  hud.className = 'game-hud';
  const body = document.createElement('pre');
  body.style.fontSize = '16px';
  body.style.lineHeight = '1.4';
  body.style.color = 'var(--cyan)'; // Make board pop
  box.appendChild(hud);
  box.appendChild(body);
  out.appendChild(box);
  scr.scrollTop = scr.scrollHeight;

  let b = Array(9).fill(' ');
  let done = false;

  function render(){
    const c = (i) => b[i] === ' ' ? (i+1) : b[i];
    body.innerHTML = '<span class="dim">┌───┬───┬───┐</span>\n' +
      '<span class="dim">│</span> ' + c(0) + ' <span class="dim">│</span> ' + c(1) + ' <span class="dim">│</span> ' + c(2) + ' <span class="dim">│</span>\n' +
      '<span class="dim">├───┼───┼───┤</span>\n' +
      '<span class="dim">│</span> ' + c(3) + ' <span class="dim">│</span> ' + c(4) + ' <span class="dim">│</span> ' + c(5) + ' <span class="dim">│</span>\n' +
      '<span class="dim">├───┼───┼───┤</span>\n' +
      '<span class="dim">│</span> ' + c(6) + ' <span class="dim">│</span> ' + c(7) + ' <span class="dim">│</span> ' + c(8) + ' <span class="dim">│</span>\n' +
      '<span class="dim">└───┴───┴───┘</span>';
    hud.innerHTML = done ? 'game over · q or esc' : 'you are <span class="cyan bold">X</span> · type cell 1-9 + enter · q to quit';
  }
  function winner(){
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const [a,b2,c] of lines) if (b[a] !== ' ' && b[a] === b[b2] && b[a] === b[c]) return b[a];
    return b.every(v => v !== ' ') ? 'draw' : null;
  }
  function aiMove(){
    const empty = b.map((v, i) => v === ' ' ? i : -1).filter(i => i >= 0);
    if (!empty.length) return;
    for (const i of empty) { b[i] = 'O'; if (winner() === 'O') return; b[i] = ' '; }
    for (const i of empty) { b[i] = 'X'; if (winner() === 'X') { b[i] = 'O'; return; } b[i] = ' '; }
    if (b[4] === ' ') { b[4] = 'O'; return; }
    const pick = empty[Math.floor(Math.random() * empty.length)];
    b[pick] = 'O';
  }
  function checkEnd(){
    const w = winner();
    if (w) {
      done = true;
      if (w === 'X') { beep(880, 0.15); hud.innerHTML = '<span class="green bold">you win!</span> · q or esc'; }
      else if (w === 'O') { beep(200, 0.2); hud.innerHTML = '<span class="red bold">AI wins.</span> · q or esc'; }
      else { hud.innerHTML = '<span class="amber">draw.</span> · q or esc'; }
    }
    return w;
  }
  render();
  return {
    onKey(e){
      if (done) { e.preventDefault(); gameManager.stop(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = inp.value.trim().toLowerCase();
        inp.value = '';
        if (!v) return;
        if (v === 'q' || v === 'quit' || v === 'exit') { gameManager.stop(); return; }
        const n = parseInt(v) - 1;
        if (isNaN(n) || n < 0 || n > 8 || b[n] !== ' ') { beep(200, 0.08); return; }
        b[n] = 'X'; beep(660, 0.04);
        if (checkEnd()) { render(); return; }
        aiMove();
        render();
        checkEnd();
      }
    },
    stop(){ box.remove(); }
  };
}

  };

function createHangman(){
  const words = ['terminal','javascript','hacker','matrix','pixel','runtime','kernel','buffer','glitch','synth','discord','server'];
  const word = words[Math.floor(Math.random() * words.length)];
  const guessed = new Set();
  let wrong = 0, done = false;
  const stages = [
    '  +---+\n  |   |\n      |\n      |\n      |\n      |\n=========',
    '  +---+\n  |   |\n  O   |\n      |\n      |\n      |\n=========',
    '  +---+\n  |   |\n  O   |\n  |   |\n      |\n      |\n=========',
    '  +---+\n  |   |\n  O   |\n /|   |\n      |\n      |\n=========',
    '  +---+\n  |   |\n  O   |\n /|\\  |\n      |\n      |\n=========',
    '  +---+\n  |   |\n  O   |\n /|\\  |\n /    |\n      |\n=========',
    '  +---+\n  |   |\n  O   |\n /|\\  |\n / \\  |\n      |\n========='
  ];
  const box = document.createElement('div');
  box.className = 'game-box';
  const hud = document.createElement('div');
  hud.className = 'game-hud';
  
  const art = document.createElement('pre');
  art.style.fontSize = '14px';
  art.style.color = 'var(--amber)'; // Amber gallows
  art.style.textShadow = '0 0 8px rgba(255,203,92,.4)';
  
  const wordEl = document.createElement('div');
  wordEl.style.marginTop = '15px';
  wordEl.style.fontSize = '24px';
  wordEl.style.fontWeight = 'bold';
  wordEl.style.letterSpacing = '8px';
  wordEl.style.color = 'var(--cyan)'; // Cyan letters
  wordEl.style.textShadow = '0 0 12px rgba(63,228,255,.4)';
  
  box.appendChild(hud); box.appendChild(art); box.appendChild(wordEl);
  out.appendChild(box);
  scr.scrollTop = scr.scrollHeight;
  function render(){
    art.textContent = stages[wrong];
    wordEl.textContent = word.split('').map(c => guessed.has(c) || done ? c : '_').join(' ');
    hud.innerHTML = 'hangman · wrong: <span class="sc">' + wrong + '/6</span> · guess a letter + enter · <span class="amber">q = quit</span>';
  }
  function checkEnd(){
    if (word.split('').every(c => guessed.has(c))) {
      done = true; beep(880, 0.2);
      hud.innerHTML = '<span class="green bold">you got it!</span> word: ' + word + ' · any key';
    } else if (wrong >= 6) {
      done = true; beep(120, 0.3, 'sawtooth');
      hud.innerHTML = '<span class="red bold">you died.</span> word was: ' + word + ' · any key';
    }
  }
  render();
  return {
    onKey(e){
      if (done) { e.preventDefault(); gameManager.stop(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = inp.value.trim().toLowerCase();
        inp.value = '';
        if (!v) return;
        if (v === 'q' || v === 'quit' || v === 'exit') { gameManager.stop(); return; }
        const ch = v[0];
        if (!/[a-z]/.test(ch) || guessed.has(ch)) { beep(200, 0.05); return; }
        guessed.add(ch);
        if (word.includes(ch)) { beep(660, 0.04); } else { wrong++; beep(220, 0.1); }
        render(); checkEnd();
      }
    },
    stop(){ box.remove(); }
  };
}

  const timeout = setTimeout(() => {
    if (stopped) return;
    armed = true;
    t0 = performance.now();
    body.innerHTML = '<span class="green bold" style="font-size:24px">PRESS ANY KEY NOW</span>';
    beep(880, 0.1);
  }, 1400 + Math.random() * 2800);
  return {
    onKey(e){
      e.preventDefault();
      if (stopped) return;
      if (!armed) {
        stopped = true; clearTimeout(timeout);
        body.innerHTML = '<span class="red bold">too early!</span> wait for the cue.';
        beep(180, 0.2); hud.innerHTML = 'press any key to exit';
        return;
      }
      const ms = Math.round(performance.now() - t0);
      stopped = true;
      const label = ms < 180 ? 'lightning ⚡' : ms < 280 ? 'quick' : ms < 450 ? 'solid' : 'keep practicing';
      body.innerHTML = 'reaction: <span class="cyan bold">' + ms + 'ms</span> · ' + label;
      beep(ms < 250 ? 880 : 440, 0.1);
      hud.innerHTML = 'press any key to exit';
    },
    stop(){ stopped = true; clearTimeout(timeout); box.remove(); }
  };
}

def(['matrix'], () => {
  if (document.getElementById('matrix-canvas')) return;
  const canvas = document.createElement('canvas');
  canvas.id = 'matrix-canvas';
  canvas.style.cssText = 'position:absolute;inset:0;z-index:10;pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.55);';
  crt.appendChild(canvas);
  canvas.width = crt.clientWidth;
  canvas.height = crt.clientHeight;
  const ctx = canvas.getContext('2d');
  const fontSize = 14;
  const cols = Math.floor(canvas.width / fontSize);
  const drops = Array(cols).fill(1);
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789abcdefghijklmnopqrstuvwxyz';
  let raf, stopped = false;
  function draw(){
    if (stopped) return;
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(59,255,125,0.9)';
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    raf = requestAnimationFrame(draw);
  }
  function stop(){
    if (stopped) return;
    stopped = true;
    cancelAnimationFrame(raf);
    canvas.remove();
    window.removeEventListener('keydown', onEsc);
    line('<span class="green">welcome back.</span>');
  }
  function onEsc(e){ if (e.key === 'Escape') { e.preventDefault(); stop(); } }
  canvas.addEventListener('click', stop);
  window.addEventListener('keydown', onEsc);
  line('<span class="green bold">enter the matrix.</span> <span class="dim">click or esc to wake up.</span>');
  draw();
});

function nope(orig){
  const keys = Object.keys(CMDS).filter(k => !k.startsWith('_'));
  let best = null, bd = 3;
  keys.forEach(k => {
    const d = editDist(orig.toLowerCase(), k);
    if (d < bd) { bd = d; best = k; }
  });
  line('vsh: ' + esc(orig) + ': command not found' + (best ? ' <span class="dim">— did you mean</span> ' + runChip(best, best) + '<span class="dim">?</span>' : ''));
  line('<span class="dim">run</span> ' + runChip('help', 'help') + '<span class="dim"> for the menu</span>');
  beep(160, 0.15, 'square');
  glitchAndShake();
}
function editDist(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[m][n];
}

function run(raw){
  if (document.getElementById('overlay-frame')) return;
  if (gameManager.game) { line('<span class="amber">a game is running — esc or q first</span>'); return; }
  echoInput(raw);
  const s = raw.trim();
  if (!s) return;
  hist.push(s); hi = hist.length;
  const parts = s.split(/\s+/);
  const c = CMDS[parts[0].toLowerCase()];
  if (!c || String(parts[0])[0] === '_') { nope(parts[0]); return; }
  beep(520, 0.025);
  try { c(parts.slice(1)); }
  catch (err) { line('<span class="red">vsh: internal error — ' + esc(err.message) + '</span>'); }
}

inp.addEventListener('keydown', e => {
  if (gameManager.game) {
    if (e.key === 'Escape') { e.preventDefault(); gameManager.stop(); return; }
    gameManager.game.onKey(e);
    return;
  }
  if (e.key === 'Enter') { const v = inp.value; inp.value = ''; run(v); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) { hi--; inp.value = hist[hi] || ''; } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (hi < hist.length) { hi++; inp.value = hist[hi] || ''; } }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  
  // FIX 2: Ctrl+L now resets to banner
  else if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { 
    e.preventDefault(); 
    out.innerHTML = ''; 
    banner(); 
  }
  
  else if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { echoInput(inp.value + '^C'); inp.value = ''; }
});
function complete(){
  const v = inp.value, parts = v.split(/\s+/), last = parts[parts.length - 1] || '';
  let pool;
  if (parts.length <= 1) pool = Object.keys(CMDS).filter(k => !k.startsWith('_'));
  else {
    pool = Object.keys(FILES).map(k => k.replace(/\.md$/, ''))
      .concat(['projects'], DATA.socials.map(s => s[0]), ['discord'], ['cyan', 'amber', 'green', 'paper'], ['on','off']);
    if (parts[0].toLowerCase() === 'theme') pool = ['cyan', 'amber', 'green', 'paper'];
    if (parts[0].toLowerCase() === 'open') pool = DATA.socials.map(s => s[0]).concat(['discord']);
    if (parts[0].toLowerCase() === 'sound') pool = ['on', 'off'];
    if (parts[0].toLowerCase() === 'page') pool = ['music', 'links', 'about', 'blog'];
  }
  const hits = pool.filter(p => p.indexOf(last) === 0 && p !== last);
  if (!hits.length) return;
  if (hits.length === 1) { parts[parts.length - 1] = hits[0]; inp.value = parts.join(' ') + ' '; return; }
  echoInput(v);
  line(hits.map(h => '<span class="cyan">' + esc(h) + '</span>').join('   '), 'dim');
}
