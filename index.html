<style>

html{height:100%}

:root{--bg:#0a0a10;--fg:#d7dcf0;--dim:#8b93b8;--faint:#565e85;--cyan:#41e4ff;--violet:#a78bfa;--green:#63f2a4;--amber:#ffcb5c;--red:#ff6b8a;--link:#8fd8ff;--glow:0 0 12px rgba(120,160,255,.10);--scan:.26;--vig:.52;--beam:.05;--flickbg:rgba(150,180,255,.03)}
[data-theme=amber]{--bg:#0d0b06;--fg:#f2e3bb;--dim:#a89264;--faint:#6e5c3c;--cyan:#ffb000;--violet:#ff9d5c;--green:#ffd27a;--link:#ffc046;--glow:0 0 12px rgba(255,176,0,.10);--scan:.22;--vig:.45;--beam:.04;--flickbg:rgba(255,200,110,.02)}
[data-theme=green]{--bg:#050805;--fg:#cdf3d3;--dim:#74a87d;--faint:#3f6046;--cyan:#3bff7d;--violet:#8ce9ad;--green:#3bff7d;--link:#83ffab;--glow:0 0 12px rgba(59,255,125,.10);--scan:.28;--vig:.5;--beam:.05;--flickbg:rgba(120,255,150,.02)}
[data-theme=paper]{--bg:#f3efe7;--fg:#191b22;--dim:#5c6070;--faint:#9ba0b0;--cyan:#0057d8;--violet:#6d28d9;--green:#0a7a3d;--link:#0057d8;--glow:none;--scan:.06;--vig:.10;--beam:0;--flickbg:transparent}
#crt{position:relative;width:min(1040px,calc(100vw - 16px));height:min(780px,calc(100dvh - 16px));background:var(--bg);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 120px rgba(0,0,0,.55),0 0 0 1px rgba(130,140,190,.16),0 30px 90px rgba(0,0,0,.75);animation:power .6s ease-out}
@keyframes power{0%{transform:scaleY(.004);filter:brightness(3)}55%{transform:scaleY(1.01)}75%{transform:scaleY(1)}100%{filter:brightness(1)}}
#bar{position:absolute;top:0;left:0;right:0;height:34px;z-index:9;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(255,255,255,.025);border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:var(--dim);user-select:none}
#bar .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);flex:none}
#bar .barlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .spacer{flex:1}
#bar .chip{cursor:pointer;font:inherit;color:var(--dim);background:none;border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:2px 9px;flex:none}
#bar .chip:hover{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(63,228,255,.25)}
[data-theme=paper] #bar{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}
[data-theme=paper] #bar .chip{border-color:rgba(0,0,0,.2)}
#screen{position:absolute;top:34px;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:20px 24px 90px;cursor:text;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#screen::-webkit-scrollbar{width:8px}
#screen::-webkit-scrollbar-thumb{background:var(--faint);border-radius:4px}
.t{white-space:pre-wrap;overflow-wrap:break-word;font-size:14px;line-height:1.6;color:var(--fg);text-shadow:var(--glow)}
.cyan{color:var(--cyan)}.violet{color:var(--violet)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.dim{color:var(--dim)}.faint{color:var(--faint)}.bold{font-weight:700}
.banner{font-size:13px;line-height:1.4;text-shadow:0 0 10px rgba(63,228,255,.45)}
[data-theme=amber] .banner{text-shadow:0 0 10px rgba(255,176,0,.45)}
[data-theme=green] .banner{text-shadow:0 0 10px rgba(59,255,125,.45)}
[data-theme=paper] .banner{text-shadow:none}
a{color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(140,215,255,.4)}
a:hover{color:var(--cyan)}
[data-theme=paper] a{text-decoration-color:rgba(0,87,216,.4)}
.chiprun{cursor:pointer;color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted}
.chiprun:hover{color:var(--cyan)}
#inline{display:flex;align-items:baseline;margin-top:2px}
#inline[hidden]{display:none}
.p{white-space:pre;font-size:14px;color:var(--fg)}
#inp{flex:1;min-width:60px;background:none;border:0;outline:0;font:inherit;color:var(--fg);caret-color:var(--cyan);padding:0}
.layer{position:absolute;inset:0;pointer-events:none}
#beam{position:absolute;left:0;right:0;top:-140px;height:140px;pointer-events:none;z-index:4;background:linear-gradient(to bottom,transparent,rgba(150,190,255,var(--beam)),transparent);animation:sweep 7s linear infinite}
@keyframes sweep{from{top:-140px}to{top:100%}}
#scan{z-index:6;background:repeating-linear-gradient(to bottom,rgba(0,0,0,var(--scan)) 0 1px,transparent 1px 3px)}
#vig{z-index:7;background:radial-gradient(115% 115% at 50% 42%,transparent 55%,rgba(0,0,0,var(--vig)) 100%)}
#flick{z-index:8;background:var(--flickbg);animation:flick 3.4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:.4}12%{opacity:.9}25%{opacity:.5}37%{opacity:.85}50%{opacity:.4}62%{opacity:.75}75%{opacity:.35}87%{opacity:.8}}
@media (prefers-reduced-motion:reduce){#beam,#flick,#crt{animation:none}}
::selection{background:var(--cyan);color:#04101a}
@media (max-width:640px){#crt{border-radius:10px;width:100vw;height:100dvh}#screen{padding:14px 12px 70px}#bar .barlabel{display:none}#bar{height:30px;font-size:11px}.t,.p{font-size:13px}#inp{font-size:16px}}

<script>

const DATA = {

    { slug: 'void-sync', name: 'Void Sync', blurb: 'end-to-end encrypted clipboard sync between your devices',

    { slug: 'loot-goblin', name: 'Loot Goblin', blurb: 'RNG loot-drop engine for tabletop night',
      stack: 'TypeScript · Canvas · Web Audio',
      details: [
        'what    : animated loot drops with weighted tables and dramatic rarity reveals',

    { slug: 'termfolio', name: 'TermFolio', blurb: 'this site — a fake shell pretending to be a resume',
      stack: 'Vanilla JS · CSS CRT fx · zero dependencies',
      details: [
        'what    : the page you are reading right now',
        'role    : solo dev, obviously',
        'how     : one html file, no build step, a tiny command parser,',
        '          and enough css to fake a crt',
        'stats   : 0 dependencies · ~30kb · runs anywhere forever',
        'learned : constraint breeds style'] },
  ],
  skills: [['TypeScript',82],['Node.js',85],['Python',68],['Rust',41],['SQL · Postgres',72],['Docker · CI',56],['Linux',78],['Lua · Roblox',63]],
};
const FONT = {
  A:['    _    ','   / \\   ','  / _ \\  ',' / ___ \\ ','/_/   \\_\\'],

  H:[' _   _ ','| | | |','| |_| |','|  _  |','|_| |_|'],

  T:[' _____ ','|_   _|','  | |  ','  | |  ','  |_|  '],
  U:[' _   _ ','| | | |','| | | |','| |_| |',' \\___/ '],
  V:['__   __','\\ \\ / /',' \\ V / ','  \\ /  ','   \\/  '],
  W:['__        __','\\ \\      / /',' \\ \\ /\\ / / ','  \\ V  V /  ','   \\_/\\_/   '],
  X:['__  __','\\ \\/ /',' \\  / ',' /  \\ ','/_/\\_\\'],
  Y:['__   __','\\ \\ / /',' \\ V / ','  | |  ','  |_|  '],
  Z:[' _____','|__  /','  / / ',' / /_ ','/____|'],

  2:[' ____  ','|___ \\ ','  __) |',' / __/ ','|_____|'],
  3:[' _____','|___ /','  |_ \\',' ___) |','|____/ '],
  4:[' _  _   ','| || |  ','| || |_ ','|__   _|','   |_|  '],
  5:[' ____  ','| ___| ','|___ \\ ',' ___) |','|____/ '],
  6:['  ___  ',' / __| ','| |    ','| |__  ',' \\___| '],
  7:[' _____','|___  |','   / / ','  / /  ',' /_/   '],
  8:['  ___  ',' / _ \\ ','| (_) |',' \\___/ '],
  9:['  ___  ',' / _ \\ ','| (_) |',' \\__, |','   /_/ '],
  ' ':[' ',' ',' ',' ',' '],
  '-':['    ','    ',' ___ ','|___|','    '],
  '.':['  ','  ','  ',' _ ','(_)'],
  '!':[' _ ','(_)','| |','| |','|_|'],
  '_':[' ',' ',' ',' ',' ______ '],
  "'":[' _ ','( )','  ','  ','  '],
};
function figlet(word){
  const glyphs = String(word).split('').map(ch => FONT[ch.toUpperCase()] || FONT[ch] || FONT[' ']);
  const rows = [];
  for (let i = 0; i < 5; i++) rows.push(glyphs.map(g => g[i]).join(' '));
  return rows;
}

const $ = id => document.getElementById(id);
const out = $('output'), scr = $('screen'), inp = $('inp');
const T0 = Date.now();
const hist = []; let hi = 0;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function line(html, cls){
  const d = document.createElement('div');
  d.className = 't' + (cls ? ' ' + cls : '');
  d.innerHTML = html || '&nbsp;';
  out.appendChild(d);
  scr.scrollTop = scr.scrollHeight;
}
function blank(){ line(''); }
function link(url, label){ return '<a href="' + url + '" target="_blank" rel="noopener">' + (label || url) + '</a>'; }
function runChip(cmd, label){ return '<span class="chiprun" data-cmd="' + cmd + '">' + esc(label || cmd) + '</span>'; }
function promptHTML(){
  return '<span class="cyan">guest</span><span class="dim">@</span><span class="violet">' + esc(DATA.handle) +
    '</span><span class="dim">:</span><span class="green">~</span><span class="dim">$&nbsp;</span>';
}
function echoInput(raw){ line(promptHTML() + esc(raw)); }
function pad(s, n){ s = String(s); return s.length >= n ? s : s + ' '.repeat(n - s.length); }
function bar(pct, width){
  width = width || 16;
  const f = Math.round(pct / 100 * width);
  return '█'.repeat(f) + '░'.repeat(width - f);
}
function uptime(){
  const s = Math.floor((Date.now() - T0) / 1000);
  return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
}
function copyText(t){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).then(() => true).catch(() => fallback());
  }
  return Promise.resolve(fallback());
}

function banner(){
  figlet(DATA.name).forEach(l => line(esc(l), 'cyan banner'));
  line('<span class="bold">' + esc(DATA.name) + '</span> <span class="dim">—</span> <span class="violet">' + esc(DATA.role) + '</span>');
  line('<span class="dim">' + esc(DATA.tagline) + '</span>');
  line('<span class="dim">site:</span> ' + link('https://' + DATA.site));
  blank();
  line('type ' + runChip('help', 'help') + ' to look around · ' + runChip('projects', 'projects') + ' for my work · ' + runChip('socials', 'socials') + ' to find me');
  blank();
}
function skillLines(){
  const rows = DATA.skills.map(s => '  ' + pad(s[0], 15) + bar(s[1]) + '  ' + s[1] + '%');
  rows.push('');
  rows.push('  (self-rated · inflated by 10% to be safe)');
  return rows;
}
function socialLines(){
  const rows = ['  ' + pad('discord', 10) + link(DATA.discordProfile) + '  <span class="dim">' + copyChip() + '</span>'];
  DATA.socials.forEach(s => rows.push('  ' + pad(s[0], 10) + link(s[1])));
  return rows;
}
function copyChip(){
  return '<span class="chiprun" data-copy="' + esc(DATA.discordProfile) + '">[copy link]</span>';
}
function contactLines(){
  return [
    '  fastest  : ' + link(DATA.discordProfile, 'discord dm') + '  ' + copyChip(),
    '  website  : ' + link('https://' + DATA.site),
    '  email    : none — dms only',
    '',
    '  i answer within ~24h. no small talk needed — just say what you need.',
  ];
}
function projLines(p){
  const rows = [];
  rows.push('<span class="cyan bold">' + esc(p.name) + '</span> <span class="dim">(' + esc(p.slug) + ')</span>');
  rows.push('<span class="amber">' + esc(p.stack) + '</span>');
  rows.push('');
  p.details.forEach(d => rows.push('  ' + esc(d)));
  rows.push('');
  return rows;
}
const FILES = {};
FILES['about.txt']    = () => DATA.about.map(esc);
FILES['skills.txt']   = () => skillLines().map(esc);
FILES['contact.txt']  = () => contactLines();
FILES['socials.txt']  = () => socialLines();
FILES['readme.md']    = () => ['this is a fake filesystem.', 'try: ls · cat about.txt · cat projects/' + DATA.projects[0].slug];
DATA.projects.forEach(p => { FILES['projects/' + p.slug + '.md'] = () => projLines(p).map(esc); });
function resolveFile(name){
  const tries = [name, name + '.md', 'projects/' + name + '.md', 'projects/' + name];
  for (const t of tries) if (FILES[t]) return t;
  return null;
}

const CMDS = {};
function def(names, fn){ names.forEach(n => CMDS[n] = fn); }
def(['help'], () => {
  line('<span class="cyan bold">CORE</span>');
  [['help','this menu'],['about','who i am'],['projects','list of things i built'],['skills','stack, honestly rated'],
     ['socials','everywhere i exist'],['discord','copy my discord profile link'],['contact','reach me'],
   ['open <site>','open a link in a new tab']]
    .forEach(c => line('  ' + pad(c[0], 17) + '<span class="dim">' + c[1] + '</span>'));
  line('<span class="cyan bold">SYSTEM</span>');
  [['ls / cat <file>','fake filesystem — try: cat about.txt'],['neofetch','system info, flex edition'],
   ['theme <name>','cyan · amber · green · paper'],['whoami','existential inquiry'],['banner','title screen'],
   ['date · echo · history','the classics'],['clear','wipe the screen (ctrl+L)']]
    .forEach(c => line('  ' + pad(c[0], 17) + '<span class="dim">' + c[1] + '</span>'));
  line('<span class="cyan bold">SECRETS</span>');
  line('  ' + pad('sudo · exit · rm', 17) + '<span class="dim">…try them and see</span>');
  blank();
  line('<span class="dim">tip: tab completes · ↑/↓ walks history · ctrl+L clears</span>');
});
def(['clear'], () => { out.innerHTML = ''; });
def(['banner'], banner);
def(['about'], () => { FILES['about.txt']().forEach(l => line(l)); blank(); line('<span class="dim">see also: ' + runChip('skills', 'skills') + ' · ' + runChip('projects', 'projects') + '</span>'); });
def(['projects', 'work'], () => {
  blank();
  DATA.projects.forEach((p, i) => {
    line('  <span class="faint">[' + pad(String(i + 1), 2) + ']</span> <span class="cyan">' + pad(p.slug, 14) + '</span><span class="dim">' + esc(p.blurb) + '</span>');
  });
  blank();
  line('<span class="dim">details: ' + runChip('cat projects/' + DATA.projects[0].slug, 'cat projects/<slug>') + '</span>');
});
def(['skills'], () => { blank(); FILES['skills.txt']().forEach(l => line(l)); blank(); });
def(['socials', 'social', 'links'], () => { blank(); FILES['socials.txt']().forEach(l => line(l)); blank(); });
def(['contact'], () => { blank(); FILES['contact.txt']().forEach(l => line(l)); blank(); });
def(['discord'], () => {
  copyText(DATA.discordProfile).then(ok => {
    line(ok ? '<span class="green">[ok]</span> discord profile link copied:'
            : '<span class="amber">[!!]</span> could not auto-copy — open it here:');
    line('  ' + link(DATA.discordProfile));
    line('<span class="dim">dm me. i probably live there.</span>');
  });
});
def(['open'], args => {
  const q = (args[0] || '').toLowerCase();
  if (!q) { line('open what? try: ' + DATA.socials.map(s => '<span class="dim">' + s[0] + '</span>').join(' · ') + ' · <span class="dim">discord</span>'); return; }
  if (q === 'discord' || q === 'dc') {
    window.open(DATA.discordProfile, '_blank', 'noopener');
    line('opening discord profile … ' + link(DATA.discordProfile));
    return;
  }
  if (q === 'site' || q === 'website') {
    window.open('https://' + DATA.site, '_blank', 'noopener');
    line('opening ' + link('https://' + DATA.site) + ' …');
    return;
  }
  const hit = DATA.socials.find(s => s[0].indexOf(q) === 0);
  if (!hit) { line('<span class="red">no link called "' + esc(q) + '"</span> — run ' + runChip('socials', 'socials')); return; }
  window.open(hit[1], '_blank', 'noopener');
  line('opening ' + link(hit[1]) + ' …');
});
def(['cat'], args => {
  const name = args.join(' ');
  if (!name) { line('usage: cat &lt;file&gt; — try ' + runChip('cat about.txt', 'cat about.txt')); return; }
  if (name === 'projects' || name === 'projects/') { CMDS['projects'](); return; }
  const key = resolveFile(name);
  if (!key) { line('<span class="red">cat: ' + esc(name) + ': no such file</span> — run ' + runChip('ls', 'ls')); return; }
  blank(); FILES[key]().forEach(l => line(l)); blank();
});

function nope(orig){
  const keys = Object.keys(CMDS).filter(k => !k.startsWith('_'));
  let best = null, bd = 3;
  keys.forEach(k => {
    const d = editDist(orig.toLowerCase(), k);
    if (d < bd) { bd = d; best = k; }
  });
  line('vsh: ' + esc(orig) + ': command not found' + (best ? ' <span class="dim">— did you mean</span> ' + runChip(best, best) + '<span class="dim">?</span>' : ''));
  line('<span class="dim">run</span> ' + runChip('help', 'help') + '<span class="dim"> for the menu</span>');
}
function editDist(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[m][n];
}

function run(raw){
  echoInput(raw);
  const s = raw.trim();
  if (!s) return;
  hist.push(s); hi = hist.length;
  const parts = s.split(/\s+/);
  const c = CMDS[parts[0].toLowerCase()];
  if (!c || String(parts[0])[0] === '_') { nope(parts[0]); return; }
  try { c(parts.slice(1)); }
  catch (err) { line('<span class="red">vsh: internal error — ' + esc(err.message) + '</span>'); }
}

inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = inp.value; inp.value = ''; run(v); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) { hi--; inp.value = hist[hi] || ''; } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); if (hi < hist.length) { hi++; inp.value = hist[hi] || ''; } }
  else if (e.key === 'Tab') {
    e.preventDefault();
    complete();
  }
  else if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); out.innerHTML = ''; }
  else if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) { echoInput(inp.value + '^C'); inp.value = ''; }
});
function complete(){
  const v = inp.value, parts = v.split(/\s+/), last = parts[parts.length - 1] || '';
  let pool;
  if (parts.length <= 1) pool = Object.keys(CMDS).filter(k => !k.startsWith('_'));
  else {
    pool = Object.keys(FILES).map(k => k.replace(/\.md$/, ''))
      .concat(['projects'], DATA.socials.map(s => s[0]), ['discord', 'site'], ['cyan', 'amber', 'green', 'paper']);
    if (parts[0].toLowerCase() === 'theme') pool = ['cyan', 'amber', 'green', 'paper'];
    if (parts[0].toLowerCase() === 'open') pool = DATA.socials.map(s => s[0]).concat(['discord', 'site']);
  }
  const hits = pool.filter(p => p.indexOf(last) === 0 && p !== last);
  if (!hits.length) return;
  if (hits.length === 1) { parts[parts.length - 1] = hits[0]; inp.value = parts.join(' ') + ' '; return; }
  echoInput(v);
  line(hits.map(h => '<span class="cyan">' + esc(h) + '</span>').join('   '), 'dim');
}
scr.addEventListener('pointerup', () => {

out.addEventListener('click', e => {

      : '<span class="amber">[!!]</span> auto-copy failed — handle: <span class="bold">' + esc(cp.dataset.copy) + '</span>', 'dim'));
    return;
  }
  const cm = e.target.closest('[data-cmd]');
  if (cm) { run(cm.dataset.cmd); inp.focus({ preventScroll: true }); }
});
